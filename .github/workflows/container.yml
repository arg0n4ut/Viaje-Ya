name: Build and Publish Containers

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/viaje-ya-app:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE_NAME" .

      - name: Compose smoke test
        run: |
          set -euo pipefail
          trap 'docker compose -f compose.yaml down --volumes --remove-orphans' EXIT
          docker compose -f compose.yaml up --build -d
          timeout 120 bash -c 'until curl -fs http://localhost:8000/; do sleep 5; done'
          curl -fs http://localhost:8000/

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE_NAME"
