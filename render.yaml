services:
  - type: web
    name: viaje-ya-api
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false  # Atlas URI in Render dashboard 
      - key: MONGODB_DB
        value: viaje_ya
